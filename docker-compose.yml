# Manifiesto de despliegue (RQ-03). Un solo comando desde un clon limpio:
#
#     docker compose up --build
#
# Compatible con `docker stack deploy -c docker-compose.yml huella` (Swarm) una vez construida la imagen.
# Los límites se declaran AQUÍ, no a mano con `docker run -m`: es el único lugar donde queda escrito el
# entorno (128 MB) que RQ-01 necesita para poder comprobarse.

services:
  huella-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: siliconminds/huella-service:1.0.0
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M       # RQ-01: el contenedor no debe superar 128 MB en ningún instante
        reservations:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      # Pide /api/huellas/salud: calcula la huella de "abc" con la biblioteca nativa y la compara con el
      # estándar. 200 solo si libhuella.so cargó y da el valor correcto ("primera huella correcta").
      # bash (no sh): dash no soporta /dev/tcp, y la imagen no trae curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/huellas/salud HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 2s
    restart: unless-stopped

  # Los demás servicios del sistema (Angular, microservicios, Keycloak) los aporta el frente de Web 2.
  # Se agregan en este mismo archivo para que un solo comando levante todo.
